{% extends "base-main.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="dashboard-container">
    <h1>Bem-vindo ao Dashboard, {{ username|capitalize }}!</h1>
    <p>Você acessou uma página protegida. Parabéns!</p>
    <p>Este é o lugar onde os snippets estarão.</p>
    <form hx-post="/logout" hx-target="body" hx-swap="outerHTML">
        <button type="submit" class="cautious">Sair</button>
    </form>
</div>
{% endblock %}
